apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: svc-demo

  template:
    metadata:
      labels:
        app: svc-demo

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
