apiVersion: v1
kind: Pod
metadata:
  name: probe-demo

spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        failureThreshold: 15

      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /t
          port: 80
        periodSeconds: 10
