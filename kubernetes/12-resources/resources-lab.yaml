apiVersion: v1
kind: Pod
metadata:
  name: resources-demo

spec:
  containers:
    - name: demo
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]

      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"

        limits:
          memory: "256Mi"
          cpu: "500m"
